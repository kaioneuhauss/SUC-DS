# Scripts compartilhados pelos dois Plans. Nao contem credenciais.
# data/base64 preserva a compatibilidade com server-side apply do Fleet.
# O README mostra como ler e editar o conteudo, sem gerador proprio.
apiVersion: v1
kind: Secret
metadata:
  name: os-maintenance-shared-scripts
  namespace: cattle-system
type: Opaque
data:
  common.sh: 
  health.sh: 
  host-preflight.sh: 
  host-worker.sh: 
  policy.json: 
  run.sh: 
  storage-guard.jq: 
  wait-servers.sh: 
