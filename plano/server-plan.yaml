# Edite spec.version nos DOIS Plans com o mesmo identificador de rodada.
# Reutiliza a ServiceAccount system-upgrade-controller existente em cattle-system.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: os-maintenance-server
  namespace: cattle-system
  annotations:
    upgrade.cattle.io/digest: spec.upgrade.envs,spec.upgrade.image,spec.prepare
spec:
  concurrency: 1
  exclusive: true
  jobActiveDeadlineSecs: 18000
  postCompleteDelay: 30s
  serviceAccountName: system-upgrade-controller
  version: mpba-update-06
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
      suc-os.cattle.io/enabled: 'true'
    matchExpressions:
    - key: kubernetes.io/hostname
      operator: In
      values:
      - master-mbpa1
      - master-mpba2
      - master-mpba3
  tolerations:
  - operator: Exists
  secrets:
  - name: os-maintenance-shared-scripts
    path: /run/suc-os
  upgrade:
    image: registry.rancher.com/rancher/rke2-upgrade:v1.35.6-rke2r1@sha256:ac50dbeabcb4e1e8a63dfe5715837e35b90f36f742568c9cf470a0adf4d95aef
    command:
    - /bin/bash
    args:
    - /run/suc-os/run.sh
    securityContext:
      privileged: true
      runAsUser: 0
    envs:
    - name: PLAN_NAMESPACE
      value: cattle-system
    - name: ACTION
      value: update
    - name: PROFILE
      value: micro62
    - name: EXPECTED_NODES
      value: master-mbpa1,master-mpba2,master-mpba3,worker-mpba1,worker-mpba2
    - name: LH_NAMESPACE
      value: longhorn-system
    - name: HEALTH_TIMEOUT
      value: '1800'
    - name: STABLE_SECONDS
      value: '60'
    - name: DRAIN_TIMEOUT
      value: 30m
    - name: HOST_TIMEOUT
      value: '7200'
    - name: ACTIVATE_PENDING
      value: 'true'
    - name: MANAGE_AUTOMATIC
      value: 'true'
    - name: PEER_PLAN
      value: os-maintenance-agent