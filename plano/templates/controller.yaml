{{- if .Values.controller.enabled }}
{{- if eq .Release.Namespace "cattle-system" }}{{ fail "Use namespace dedicado para controller.enabled=true" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: suc-os-controller
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-controller
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list, watch, update, patch]
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, update, patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [plans.upgrade.cattle.io]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-controller
subjects:
  - kind: ServiceAccount
    name: suc-os-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: suc-os-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: [pods, secrets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [upgrade.cattle.io]
    resources: [plans, plans/status]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: suc-os-controller
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: suc-os-controller
subjects:
  - kind: ServiceAccount
    name: suc-os-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suc-os-controller
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      upgrade.cattle.io/controller: suc-os-controller
  template:
    metadata:
      labels:
        upgrade.cattle.io/controller: suc-os-controller
    spec:
      serviceAccountName: suc-os-controller
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  upgrade.cattle.io/controller: suc-os-controller
      containers:
        - name: controller
          image: {{ .Values.controller.image | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          env:
            - {name: SYSTEM_UPGRADE_CONTROLLER_NAME, value: suc-os-controller}
            - name: SYSTEM_UPGRADE_CONTROLLER_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: SYSTEM_UPGRADE_CONTROLLER_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - {name: SYSTEM_UPGRADE_CONTROLLER_LEADER_ELECT, value: 'true'}
            - {name: SYSTEM_UPGRADE_CONTROLLER_THREADS, value: '1'}
            - {name: SYSTEM_UPGRADE_JOB_BACKOFF_LIMIT, value: '6'}
            - {name: SYSTEM_UPGRADE_JOB_TTL_SECONDS_AFTER_FINISH, value: '86400'}
            - {name: SYSTEM_UPGRADE_JOB_PRIVILEGED, value: 'true'}
            - {name: SYSTEM_UPGRADE_JOB_IMAGE_PULL_POLICY, value: IfNotPresent}
            - {name: SYSTEM_UPGRADE_JOB_KUBECTL_IMAGE, value: registry.rancher.com/rancher/kuberlr-kubectl:v7.0.3}
{{- end }}
