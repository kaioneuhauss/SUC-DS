apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.planName }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Values.planName }}
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list, patch]
  - apiGroups: ['']
    resources: [pods, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list]
  - apiGroups: ['']
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list]
  - apiGroups: [upgrade.cattle.io]
    resources: [plans]
    verbs: [get, list]
  - apiGroups: [longhorn.io]
    resources: [settings, volumes, nodes, engines, replicas]
    verbs: [get, list]
  - nonResourceURLs: [/readyz, /readyz/*, /version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Values.planName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Values.planName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.planName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.planName }}-gate
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [create]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [suc-os-maintenance-gate]
    verbs: [get, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.planName }}-gate
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.planName }}-gate
subjects:
  - kind: ServiceAccount
    name: {{ .Values.planName }}
    namespace: {{ .Release.Namespace }}
