# Codigo compartilhado, sem credenciais. Edite texto normal: nao codifique em base64.
# stringData e convertido em data pelo Kubernetes automaticamente.
# Qualquer alteracao aqui pode disparar manutencao: publique com nova version nos Plans.
apiVersion: v1
kind: Secret
metadata:
  name: os-maintenance-shared-scripts
  namespace: cattle-system
type: Opaque
stringData:
  # 1. Verificacoes iniciais; nos workers, espera os servers da mesma rodada.
  prepare.sh: |
    #!/bin/bash
    # Prepare apenas verifica. Drain, transacao e retomada continuam protegidos no upgrade.
    set -Eeuo pipefail
    SCRIPT_DIR=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
    SUC_COMPONENT=prepare
    source "$SCRIPT_DIR/common.sh"
    source "$SCRIPT_DIR/health.sh"
    source "$SCRIPT_DIR/wait-servers.sh"

    prepare_node() {
      context
      step '1/6 — Preparar a atualização'
      log '[INFO] Verificando a ordem de atualização e a saúde do cluster. Durante esta preparação, o pod aparece como Init:0/1.'
      if [[ -n ${SERVER_PLAN:-} ]]; then
        wait_servers
      else
        setup_api
        discover_nodes
      fi
      # O prepare nao precisa ler o host: detecta retomada pela trava na API.
      # O upgrade privilegiado ainda exige o estado persistido e valida boot/snapshot.
      local gate
      gate=$(k -n "$NS" get cm "$GATE" --ignore-not-found -o json) ||
        fail 'Nao foi possivel consultar a trava de manutencao; verificar API/RBAC.'
      if [[ -n $gate ]] && jq -e '.data.phase=="failed"' <<<"$gate" >/dev/null; then
        fail "Rodada bloqueada por falha no no $(jq -r .data.node <<<"$gate"). Corrija a causa e revise a trava antes de retomar."
      fi
      if [[ -n $gate ]] && jq -e --arg node "$NODE" --arg hash "$HASH" '
        .data.node==$node and .data.hash==$hash and
        (.data.phase=="updating" or .data.phase=="verifying")' <<<"$gate" >/dev/null; then
        log "[RETOMADA] Trava deste no na fase=$(jq -r .data.phase <<<"$gate"). O upgrade validara estado do host, boot e snapshot antes de recuperar o no. Nao repetir drain/transacao nesta preparacao."
        return 0
      fi
      step '2/6 — Verificar se o cluster está pronto'
      log '[INFO] Verificando os nós, as aplicações e os volumes. Esta etapa não altera o host.'
      wait_health false
      log '[OK] As verificações terminaram. Abra o log do container upgrade para acompanhar a atualização.'
    }

    if [[ ${BASH_SOURCE[0]} == "$0" ]]; then prepare_node; fi
  # 2. Fluxo principal: trava, validacao, drain, SO, reboot quando necessario e retomada.
  run.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    SCRIPT_DIR=$(cd -- "$(dirname -- "$0")" && pwd)
    source "$SCRIPT_DIR/common.sh"
    source "$SCRIPT_DIR/health.sh"
    setup_api
    context
    step '2/6 — Verificar e reservar a manutenção'
    discover_nodes
    for t in bash jq kubectl chroot; do command -v "$t" >/dev/null || fail "Ferramenta $t ausente na imagem."; done
    log "[INFO] Executando a ação $ACTION no perfil $PROFILE_NAME."
    claim_gate
    log "[INFO] Conferindo o sistema operacional, as ferramentas, o espaço livre e o acesso ao Kubernetes."
    host /bin/bash -s -- "$PROFILE" < "$SCRIPT_DIR/host-preflight.sh" || fail 'O host não passou na verificação inicial. Confira o SO, as ferramentas, o espaço livre e o systemd antes de tentar novamente.'
    k version -o json | jq -e '(.clientVersion.minor | capture("(?<n>[0-9]+)").n|tonumber) as $c | (.serverVersion.minor|capture("(?<n>[0-9]+)").n|tonumber) as $s | .clientVersion.major==.serverVersion.major and (($c-$s)|fabs)<=1' >/dev/null || fail 'Imagem kubectl fora da politica de version skew.'

    log "[OK] Sistema operacional, ferramentas e espaço livre verificados. Requisitos atendidos."

    if [[ $ACTION == prepare-host ]]; then
      [[ $MANAGE_AUTOMATIC == true ]] || fail 'Defina MANAGE_AUTOMATIC=true para transferir os agendamentos ao SUC, apos revisao.'
      host /bin/bash -s <<'HOST'
    set -Eeuo pipefail
    mkdir -p /var/lib/suc-os
    systemctl show transactional-update.timer transactional-update.service os-update.timer os-update.service rebootmgr.service -p Id -p ActiveState -p UnitFileState > /var/lib/suc-os/automatic-units-before.txt
    # Nao interromper transacao em andamento. Primeiro impedir a proxima ativacao.
    for timer in transactional-update.timer os-update.timer; do
      if [[ $(systemctl show "$timer" -p LoadState --value) != not-found ]]; then systemctl disable --now "$timer"; fi
    done
    for service in transactional-update.service os-update.service; do
      state=$(systemctl show "$service" -p ActiveState --value)
      [[ $state == inactive || $state == failed ]]
    done
    if [[ $(systemctl show rebootmgr.service -p LoadState --value) != not-found ]]; then systemctl disable --now rebootmgr.service; fi
    [[ ! -f /run/systemd/shutdown/scheduled ]]
    HOST
      k annotate node "$NODE" suc-os.cattle.io/automatic-updates=disabled --overwrite
      release_gate
      log '[CONCLUIDO] Agendamentos automáticos ausentes ou desativados. Nenhum update ou reinício executado nesta preparação.'
      exit 0
    fi
    [[ $ACTION == update ]] || fail "Acao desconhecida: $ACTION"
    k get nodes -o json | jq -e --arg expected "$EXPECTED_NODES" '.items as $nodes | all(($expected|split(","))[]; . as $n | any($nodes[]; .metadata.name==$n and .metadata.annotations["suc-os.cattle.io/automatic-updates"]=="disabled"))' >/dev/null || fail 'Execute prepare-host em TODOS os destinos antes da atualizacao.'

    if [[ ! -f $LOCAL_STATE/phase ]]; then
      wait_health false
      # O Job do Plan parceiro pode estar aguardando no prepare. A trava continua global.
      # Bloquear todos os outros Plans, inclusive os gerenciados pelo Rancher.
      k get jobs -A -o json | jq -e --arg p "$PLAN" --arg peer "${PEER_PLAN:-}" 'all(.items[] | select(.metadata.labels["upgrade.cattle.io/controller"]!=null); .metadata.labels["upgrade.cattle.io/plan"]==$p or (.metadata.labels["upgrade.cattle.io/plan"]==$peer and $peer!="") or ((.status.active // 0)==0))' >/dev/null || fail 'Ha outro Job do SUC ativo; concluir a outra manutencao primeiro.'
      if [[ $LH_ACTIVE == true ]]; then
      k -n "$LH_NAMESPACE" get settings.longhorn.io node-drain-policy disable-scheduling-on-cordoned-node -o json > "$TMP/settings.json"
      jq -e '([.items[]|select(.metadata.name=="node-drain-policy")|.value][0] == "block-if-contains-last-replica") and ([.items[]|select(.metadata.name=="disable-scheduling-on-cordoned-node")|.value][0]=="true")' "$TMP/settings.json" >/dev/null || fail 'Exige node-drain-policy=block-if-contains-last-replica e disable-scheduling-on-cordoned-node=true.'
      # Exigir redundancia real: nenhuma replica unica pode ser desligada.
      k -n "$LH_NAMESPACE" get replicas.longhorn.io -o json > "$TMP/replicas.json"
      jq -e --slurpfile replicas "$TMP/replicas.json" --arg node "$NODE" '
        all(.items[]; .metadata.name as $v |
          [$replicas[0].items[] | select(.spec.volumeName==$v and (.spec.failedAt // "")=="" and .spec.nodeID!="" and (.spec.healthyAt // "")!="") | .spec.nodeID] | unique |
          (index($node)==null or length>=2))' "$TMP/volumes.json" >/dev/null || fail 'Este nó mantém a única réplica saudável de um volume Longhorn. Crie ou recupere outra réplica antes de tentar novamente.'
      else
        log '[OK] Longhorn ausente ou sem volumes. Verificações de réplicas dispensadas; proteções de volumes locais e PDBs ativas.'
      fi
      mkdir -p "$LOCAL_STATE"
      chmod 700 "$LOCAL_STATE"
      step '3/6 — Retirar as aplicações deste nó com segurança'
      log "[INFO] Bloqueando novos agendamentos em $NODE durante a manutenção. Os outros nós continuam disponíveis."
      k cordon "$NODE"
      touch "$LOCAL_STATE/cordoned-by-plan"
      gate_phase draining
      log "[INFO] Conferindo os volumes antes de retirar os pods deste nó."
      k get pods -A --field-selector "spec.nodeName=$NODE" -o json > "$TMP/pods.json"
      k get pvc -A -o json > "$TMP/pvcs.json"
      k get pv -o json > "$TMP/pvs.json"
      jq -r --slurpfile pvcs "$TMP/pvcs.json" --slurpfile pvs "$TMP/pvs.json" --slurpfile policy "$SCRIPT_DIR/policy.json" -f "$SCRIPT_DIR/storage-guard.jq" "$TMP/pods.json" > "$TMP/blockers.txt"
      if [[ -s $TMP/blockers.txt ]]; then cat "$TMP/blockers.txt"; fail 'Volume sem condição segura para manutenção. Consulte os recursos listados acima. Nenhum pacote foi atualizado; o agendamento permanece bloqueado neste nó.'; fi
      drain_args=(drain "$NODE" --ignore-daemonsets --timeout="$DRAIN_TIMEOUT" --grace-period=-1 --pod-selector='!upgrade.cattle.io/controller')
      if jq -e '.allowEmptyDirDeletion==true' "$SCRIPT_DIR/policy.json" >/dev/null; then
        log 'AVISO: descarte de emptyDir explicitamente autorizado neste perfil.'
        drain_args+=(--delete-emptydir-data)
      fi
      log "[INFO] Executando o drain, com limite de $DRAIN_TIMEOUT e respeitando as proteções das aplicações (PDBs) e dos volumes."
      # Nunca usar --force, --disable-eviction ou ignorar pods Terminating.
      k "${drain_args[@]}" || fail 'Não foi possível retirar todos os pods com segurança. Confira os PDBs, os pods em encerramento e os volumes anexados. Corrija a causa sem remover PDBs ou finalizers.'
      log '[OK] O drain terminou. As aplicações foram retiradas respeitando as proteções de disponibilidade e volumes.'
      step '4/6 — Atualizar o sistema operacional'
      gate_phase updating
      cp "$SCRIPT_DIR/host-worker.sh" "$LOCAL_STATE/host-worker.sh"
      chmod 700 "$LOCAL_STATE/host-worker.sh"
      # O systemd do host mantem a transacao viva se o container morrer/reiniciar.
      log "[INFO] Iniciando a atualização pelo systemd do host. O progresso aparece abaixo; a transação continua no host se este pod reiniciar."
      # Liberar o cliente permite acompanhar operation.log enquanto a unidade executa.
      launch_deadline=$((SECONDS+30))
      host systemd-run --no-block --unit="suc-os-$HASH.service" --property=Type=oneshot --property="TimeoutStartSec=$HOST_TIMEOUT" \
        /bin/bash "$STATE/host-worker.sh" "$STATE" "$PROFILE" "$ACTIVATE_PENDING" || {
          host journalctl -u "suc-os-$HASH.service" -n 80 --no-pager || true
          [[ $(cat "$LOCAL_STATE/phase" 2>/dev/null || true) == reboot-pending ]] ||
            fail 'Unidade do host falhou; erro detalhado acima. Corrigir a causa antes de retomar; trava preservada.'
        }
    fi

    # Mostrar somente linhas completas novas; leitura dos logs nunca autoriza uma etapa.
    HOST_LOG_LINE=0
    show_host_output() {
      local count
      if [[ -f $LOCAL_STATE/operation.log ]]; then
        count=$(wc -l < "$LOCAL_STATE/operation.log") || return 0
        if (( count > HOST_LOG_LINE )); then
          sed -n "$((HOST_LOG_LINE+1)),${count}p" "$LOCAL_STATE/operation.log" || return 0
          HOST_LOG_LINE=$count
        fi
      fi
      return 0
    }
    deadline=$((SECONDS+HOST_TIMEOUT+600))
    last_progress=-30
    while (( SECONDS < deadline )); do
      phase=$(cat "$LOCAL_STATE/phase" 2>/dev/null || printf starting)
      show_host_output
      case "$phase" in
        failed) host journalctl -u "suc-os-$HASH.service" -n 60 --no-pager || true; fail 'Servico do host falhou. Consulte tambem /var/log/transactional-update.log ou /var/log/zypp/history.' ;;
        done|reboot-pending)
          old_boot=$(cat "$LOCAL_STATE/old-boot")
          boot=$(cat /proc/sys/kernel/random/boot_id)
          if [[ $phase == reboot-pending && $boot == "$old_boot" ]]; then log '[REBOOT] Reinicio solicitado, mas o boot ID ainda nao mudou. Aguardando; proximo no bloqueado.'
          else
            step '5/6 — Conferir o resultado e recuperar as aplicações'
            if [[ $boot != "$old_boot" ]]; then log '[OK] O reinício deste nó foi confirmado.'
            else log '[OK] Este nó permaneceu ligado, sem reinício.'; fi
            if [[ $PROFILE == micro62 ]]; then
              target=$(cat "$LOCAL_STATE/target-root")
              current=$(host btrfs inspect-internal rootid /)
              [[ $current == "$target" ]] || fail "Snapshot ativo $current difere de $target; possivel rollback."
            fi
            host /bin/bash -s -- "$PROFILE" < "$SCRIPT_DIR/host-preflight.sh" || fail 'Verificacao do host apos update falhou.'
            log "[OK] Verificações do host concluídas. Aguardando o serviço RKE2 ficar ativo."
            wait_rke2
            gate_phase verifying
            log "[OK] RKE2 ativo. Liberando o agendamento neste nó e aguardando a recuperação das aplicações e dos volumes."
            k uncordon "$NODE"
            # Longhorn pode precisar do uncordon para reconstruir replicas neste no.
            wait_health false
            result=$(cat "$LOCAL_STATE/result")
            k annotate node "$NODE" "suc-os.cattle.io/last-result=$result" "suc-os.cattle.io/last-round=$SYSTEM_UPGRADE_PLAN_LATEST_VERSION" --overwrite
            printf 'done\n' > "$LOCAL_STATE/phase"
            show_host_output
            release_gate
            step '6/6 — Concluir a manutenção deste nó'
            log "Nó: $NODE"
            case "$result" in
              no-change-no-reboot) log '[CONCLUIDO] Não havia atualizações disponíveis. Este nó não foi reiniciado. O cluster está saudável; o próximo nó já pode começar.' ;;
              updated-and-rebooted) log '[CONCLUIDO] O sistema foi atualizado e o reinício foi confirmado. O cluster está saudável; o próximo nó já pode começar.' ;;
              pending-snapshot-activated) log '[CONCLUIDO] Snapshot anteriormente pendente ativado por reboot; nenhuma nova transacao nesta passagem. Saude confirmada; proximo no liberado.' ;;
            esac
            exit 0
          fi ;;
        starting|running)
          if (( SECONDS-last_progress >= 30 )); then
            log "[AGUARDANDO] Atualização em andamento no host. Aguardando o resultado; o próximo nó permanece bloqueado."
            last_progress=$SECONDS
          fi
          active=$(host systemctl show "suc-os-$HASH.service" -p ActiveState --value)
          now=$(cat "$LOCAL_STATE/phase" 2>/dev/null || true)
          # --no-block pode retornar antes de o systemd iniciar o processo.
          if [[ $phase == starting && $active == inactive ]] && (( SECONDS < ${launch_deadline:-0} )); then
            log '[SO] Unidade aceita pelo systemd; aguardando inicio do processo no host.'
            sleep 1
            continue
          fi
          [[ $active == active || $active == activating || $now == done || $now == reboot-pending ]] || fail "Unidade do host esta $active sem conclusao; investigar journal."
          ;;
        *) fail "Fase inesperada $phase" ;;
      esac
      sleep 10
    done
    fail 'Timeout aguardando update/reboot; manter trava, investigar host e snapshot.'
  # Funcoes compartilhadas e configuracao avancada. SUC injeta NODE/PLAN/HASH/version.
  common.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    export LC_ALL=C
    SCRIPT_DIR=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
    NODE=${SYSTEM_UPGRADE_NODE_NAME:?}
    HASH=${SYSTEM_UPGRADE_PLAN_LATEST_HASH:?}
    PLAN=${SYSTEM_UPGRADE_PLAN_NAME:?}
    # Configuracao avancada. No uso normal, altere somente version nos dois Plans.
    # ${VAR:-padrao} usa o padrao quando o YAML nao fornece uma variavel.
    NS=${PLAN_NAMESPACE:-$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)}
    ACTION=${ACTION:-update}                 # update: manutencao; prepare-host: preparacao inicial.
    PROFILE=${PROFILE:-micro62}              # micro62: SLE Micro 6.2; zypper: openSUSE Leap/SLES.
    # Identificador interno curto; os logs exibem o nome completo do perfil.
    case "$PROFILE" in
      micro62) PROFILE_NAME='SLE Micro 6.2' ;;
      zypper|sles) PROFILE_NAME='openSUSE Leap / SLES' ;;
      *) echo "ERRO: perfil desconhecido: $PROFILE" >&2; exit 1 ;;
    esac
    LH_NAMESPACE=${LH_NAMESPACE:-longhorn-system}
    HEALTH_TIMEOUT=${HEALTH_TIMEOUT:-1800}    # Segundos para recuperar a saude.
    STABLE_SECONDS=${STABLE_SECONDS:-60}      # Saude continua antes de liberar o proximo no.
    DRAIN_TIMEOUT=${DRAIN_TIMEOUT:-30m}        # Limite para evacuar pods respeitando PDBs.
    HOST_TIMEOUT=${HOST_TIMEOUT:-7200}        # Limite da transacao no systemd do host.
    WAIT_TIMEOUT=${WAIT_TIMEOUT:-43200}       # Workers: limite para esperar todos os servers.
    ACTIVATE_PENDING=${ACTIVATE_PENDING:-true} # Ativa raiz pendente antes de uma nova transacao.
    MANAGE_AUTOMATIC=${MANAGE_AUTOMATIC:-true} # Usado somente com ACTION=prepare-host.
    [[ $HASH =~ ^[a-zA-Z0-9_-]+$ && $NODE =~ ^[a-zA-Z0-9.-]+$ ]]
    STATE=/var/lib/suc-os/$HASH
    LOCAL_STATE=/host$STATE
    GATE=suc-os-maintenance-gate
    OWNED=false
    FORCE_FAILURE=false
    k() { kubectl --request-timeout=30s "$@"; }
    host() { chroot /host "$@"; }
    # Kubernetes/Rancher ja registram o horario. O contexto aparece uma vez no inicio.
    # ANSI: azul = etapa/info; verde = sucesso; amarelo = espera; vermelho = falha.
    # Para exportadores sem ANSI, defina LOG_COLOR=false ou NO_COLOR=1 no container.
    log() {
      local color='0'
      case "$*" in
        'Etapa '*|\[INFO\]*|\[API\]*|\[SAUDE\]*|\[NO\]*|\[VOLUME\]*|\[VOLUMES\]*) color='1;34' ;;
        \[OK\]*|\[CONCLUIDO\]*) color='1;32' ;;
        \[ERRO\]*|\[FALHA\]*|\[INTERROMPIDO\]*|\[BLOQUEADO\]*|'[RESULTADO] Pod interrompido'*) color='1;31' ;;
        \[AGUARDANDO\]*|\[ESPERA\]*|\[ATENCAO\]*|\[ACAO\ NECESSARIA\]*|\[COMO\ CORRIGIR\]*|\[REBOOT\]*) color='1;33' ;;
      esac
      if [[ ${LOG_COLOR:-true} != false && -z ${NO_COLOR:-} && $color != 0 ]]; then
        printf '\033[%sm%s\033[0m\n' "$color" "$*"
      else
        printf '%s\n' "$*"
      fi
    }
    CURRENT_STEP='inicio'
    step() { CURRENT_STEP=${1/\// de }; log ""; log "Etapa $CURRENT_STEP"; }
    context() { log "Nó: $NODE | Rodada: $SYSTEM_UPGRADE_PLAN_LATEST_VERSION"; }
    gate_phase() {
      k -n "$NS" patch cm "$GATE" --type=merge -p "$(jq -nc --arg phase "$1" '{data:{phase:$phase}}')" >/dev/null
    }
    fail() {
      FORCE_FAILURE=true
      log ""
      log "[ERRO] Falha na etapa $CURRENT_STEP: $*"
      log "[INTERROMPIDO] A manutenção deste nó parou aqui. Este pod não executará as próximas etapas."
      if [[ -f $LOCAL_STATE/phase && $(cat "$LOCAL_STATE/phase") == running ]]; then
        log '[ATENCAO] O host ainda pode estar terminando a atualização já iniciada. Confira o resultado no systemd antes de tentar novamente; não encerre o processo à força.'
      fi
      log "[COMO CORRIGIR] Resolva a causa acima e confira a trava $NS/$GATE. Para ver o erro no host: journalctl -u suc-os-$HASH.service. Não remova a trava ou as proteções dos volumes para continuar."
      exit 1
    }
    on_exit() {
      local rc=$?
      if (( rc != 0 )); then
        if [[ $FORCE_FAILURE != true && -f $LOCAL_STATE/phase && $(cat "$LOCAL_STATE/phase") == reboot-pending ]]; then
          log "[REBOOT] Container interrompido durante reboot previsto (exit=$rc). O Job retomara a verificacao neste mesmo no; a trava impede avancar ao proximo."
          return
        fi
        log "[FALHA] A etapa $CURRENT_STEP terminou com erro (código $rc, linha ${BASH_LINENO[0]})."
        log "[DETALHE TECNICO] $BASH_COMMAND"
        if [[ $OWNED == true ]]; then
          gate_phase failed || true
          [[ ! -d $LOCAL_STATE ]] || printf 'Falha do Job; consultar logs e unidade suc-os-%s.service\n' "$HASH" > "$LOCAL_STATE/job-error"
        elif [[ ${SUC_COMPONENT:-upgrade} == prepare ]]; then
          # Erro fatal no prepare tambem bloqueia a rodada. Nunca sobrescrever trava existente.
          if k -n "$NS" create cm "$GATE" --from-literal="node=$NODE" --from-literal="hash=$HASH" --from-literal=phase=failed >/dev/null 2>&1; then
            log '[BLOQUEADO] Falha registrada na trava. A atualização só poderá continuar depois da correção.'
          else
            log '[ATENCAO] Já existe uma trava, ou a API não respondeu. Confira o estado da manutenção antes de tentar novamente.'
          fi
        fi
        log "[RESULTADO] Pod interrompido com erro. A manutenção não foi marcada como concluída."
        log "[ACAO NECESSARIA] Corrija a falha antes de iniciar outra rodada. Mesmo que o SUC recrie o pod, a trava de falha continuará impedindo o avanço."
      fi
    }
    trap on_exit EXIT
    claim_gate() {
      if k -n "$NS" create cm "$GATE" --from-literal="node=$NODE" --from-literal="hash=$HASH" --from-literal="expectedNodes=$EXPECTED_NODES" --from-literal=phase=preflight >/dev/null 2>&1; then
        OWNED=true
        log "[OK] Manutenção reservada para $NODE. Os outros nós permanecem aguardando."
        return
      fi
      local current
      current=$(k -n "$NS" get cm "$GATE" -o json) || fail 'Nao foi possivel obter a trava; verificar API/RBAC.'
      jq -e --arg n "$NODE" --arg h "$HASH" '.data.node == $n and .data.hash == $h and (.data.phase == "updating" or .data.phase == "verifying")' <<<"$current" >/dev/null ||
        fail "Trava existente: $(jq -c .data <<<"$current"). Uma falha ou outra manutencao exige diagnostico."
      OWNED=true
      # Preserva a lista anterior ao reboot: um no desaparecido nao pode ser ignorado.
      EXPECTED_NODES=$(jq -er '.data.expectedNodes | select(length>0)' <<<"$current") || fail 'Trava sem inventario dos nos; revisar antes de retomar.'
      [[ -f $LOCAL_STATE/phase ]] || fail 'Trava de retomada sem estado persistente do host.'
      log "[RETOMADA] Mesmo no e rodada; fase persistida=$(cat "$LOCAL_STATE/phase"). Verificando a transacao existente, sem iniciar outra."
    }
    release_gate() {
      local current
      current=$(k -n "$NS" get cm "$GATE" -o json)
      jq -e --arg n "$NODE" --arg h "$HASH" '.data.node == $n and .data.hash == $h' <<<"$current" >/dev/null
      k -n "$NS" delete cm "$GATE" --wait=true >/dev/null
      OWNED=false
    }

    # Credencial projetada do ServiceAccount, compartilhada pelo prepare e upgrade.
    setup_api() {
    TMP=$(mktemp -d)
    # Referencia a credencial projetada/rotativa do SA; nunca copia o token do host.
    export KUBECONFIG="$TMP/kubeconfig"
    cat > "$KUBECONFIG" <<'KUBE'
    apiVersion: v1
    kind: Config
    clusters:
    - name: cluster
      cluster:
        server: https://kubernetes.default.svc:443
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
    - name: job
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
    - name: job
      context: {cluster: cluster, user: job}
    current-context: job
    KUBE
    }

    # Descoberta automatica. Nao e necessario manter nomes de nos nos YAMLs.
    # A lista fica fixa durante este Job e e preservada na trava durante reboot.
    discover_nodes() {
      k get nodes -o json > "$TMP/discovered-nodes.json" || fail 'Falha ao descobrir nos; verificar API/RBAC.'
      EXPECTED_NODES=$(jq -er '[.items[].metadata.name] | sort | join(",") | select(length>0)' "$TMP/discovered-nodes.json") || fail 'Nenhum no encontrado na API.'
      jq -e --arg node "$NODE" 'any(.items[]; .metadata.name==$node)' "$TMP/discovered-nodes.json" >/dev/null || fail 'O proprio no nao consta na API; investigar antes da manutencao.'
      SERVER_NODES=$(jq -r '[.items[] | select(.metadata.labels["node-role.kubernetes.io/control-plane"]!=null and .metadata.labels["kubernetes.io/os"]=="linux") | .metadata.name] | sort | join(",")' "$TMP/discovered-nodes.json")
      # Este exemplo usa servers com control-plane e etcd juntos, como no MPBA.
      # Bloquear topologia diferente evita tratar um servidor etcd como worker.
      jq -e 'all(.items[]; .metadata.labels["node-role.kubernetes.io/etcd"]==null or .metadata.labels["node-role.kubernetes.io/control-plane"]!=null)' "$TMP/discovered-nodes.json" >/dev/null ||
        fail 'Encontrado etcd separado do control-plane. Revisar seletores e ordem de manutencao para essa topologia.'
      log "[OK] Nós identificados no cluster: $EXPECTED_NODES"
      log "[OK] Servidores identificados: ${SERVER_NODES:-nenhum}"
    }
  # Espera todos os servers descobertos pela API. Nunca altera o host.
  wait-servers.sh: |
    #!/bin/bash
    # Init container dos workers: nao altera hosts, nao adquire trava e nao executa drain.
    set -Eeuo pipefail
    SCRIPT_DIR=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
    SUC_COMPONENT=prepare
    source "$SCRIPT_DIR/common.sh"

    servers_finished() {
      jq -e --arg round "$SYSTEM_UPGRADE_PLAN_LATEST_VERSION" --arg names "$SERVER_NODES" \
        --slurpfile nodes "$2" '
        . as $plan |
        ($plan.status.latestHash // "") as $hash |
        ($names | split(",")) as $expected |
        ($hash != "") and ($expected | length > 0) and
        ($plan.spec.version == $round) and ($plan.status.latestVersion == $round) and
        (($plan.status.applying // []) | length == 0) and
        any($plan.status.conditions[]?; .type == "Complete" and .status == "True") and
        all($expected[]; . as $name |
          any($nodes[0].items[];
            .metadata.name == $name and
            .metadata.labels["plan.upgrade.cattle.io/" + $plan.metadata.name] == $hash))
      ' "$1" >/dev/null
    }

    wait_servers() {
      setup_api
      discover_nodes
      [[ -n $SERVER_NODES ]] || fail 'Nenhum server control-plane encontrado; revisar labels antes da manutencao dos workers.'
      local started=$SECONDS deadline=$((SECONDS+WAIT_TIMEOUT)) last_log=$SECONDS summary previous='' gate
      log '[AGUARDANDO] Aguardando a conclusão dos servidores antes de atualizar este worker.'
      log "[INFO] Limite de espera: $((WAIT_TIMEOUT/60)) minutos. Nenhum drain, update ou reinício iniciado neste worker."
      while (( SECONDS < deadline )); do
        k -n "$NS" get plan "$SERVER_PLAN" --ignore-not-found -o json > "$TMP/servers.json" ||
          fail 'Nao foi possivel consultar o Plan dos servers; verificar API/RBAC.'
        k get nodes -o json > "$TMP/nodes.json" || fail 'Nao foi possivel consultar os nos.'
        # Uma falha registrada no server encerra a espera deste Pod; nao libera o worker.
        gate=$(k -n "$NS" get cm "$GATE" --ignore-not-found -o json) || fail 'Falha ao consultar trava; verificar API/RBAC.'
        if [[ -n $gate ]] && jq -e '.data.phase=="failed"' <<<"$gate" >/dev/null; then
          fail "Manutencao bloqueada no no $(jq -r .data.node <<<"$gate"). Leia o log upgrade desse no e corrija a falha. Este worker nao iniciou atualizacao."
        fi
        if [[ -s $TMP/servers.json ]] && servers_finished "$TMP/servers.json" "$TMP/nodes.json"; then
          log "[OK] Todos os servidores concluíram esta rodada. Verificando se o cluster está pronto para atualizar este worker."
          return 0
        fi
        summary='Plan dos servers ainda nao encontrado'
        if [[ -s $TMP/servers.json ]]; then
          summary=$(jq -r --arg names "$SERVER_NODES" --slurpfile nodes "$TMP/nodes.json" '
            . as $p | ($names | split(",")) as $expected |
            [$expected[] | . as $n | select(any($nodes[0].items[];
              .metadata.name==$n and ($p.status.latestHash // "")!="" and
              .metadata.labels["plan.upgrade.cattle.io/"+$p.metadata.name]==$p.status.latestHash))] as $done |
            "Servidores concluídos: \($done|length) de \($expected|length). Em atualização: \(if (($p.status.applying // [])|length)>0 then $p.status.applying|join(", ") else "nenhum no momento" end).\nFaltam: \(($expected-$done)|join(", ")).\nRodada dos servidores: \($p.spec.version)."
            ' "$TMP/servers.json")
        fi
        if [[ $summary != "$previous" ]]; then
          log "[AGUARDANDO] $summary"
          previous=$summary; last_log=$SECONDS
        elif (( SECONDS-last_log >= 120 )); then
          log "[AGUARDANDO] Os servidores ainda estão trabalhando. Este worker espera há $(((SECONDS-started)/60)) minutos e continua sem alterações."
          last_log=$SECONDS
        fi
        sleep 10
      done
      fail 'Timeout aguardando servers. Conferir versao igual nos dois Plans, Complete, labels dos servers e logs; nao pular esta espera.'
    }

    if [[ ${BASH_SOURCE[0]} == "$0" ]]; then wait_servers; fi
  # Valida API, lista de nos, Ready, pressao, heartbeats, workloads e Longhorn opcional.
  health.sh: |
    #!/bin/bash
    # Funcoes carregadas por run.sh; todas as falhas de consulta bloqueiam o avanco.
    health_once() {
      local allow_cordon=${1:-false}
      HEALTH_REASON="API Kubernetes /readyz ainda nao esta pronta ou consulta falhou"
      k get --raw /readyz > "$TMP/readyz" || return 1
      [[ $(cat "$TMP/readyz") == ok ]] || return 1
      HEALTH_REASON="a lista de nós mudou ou há um nó indisponível, sob pressão ou com agendamento bloqueado"
      k get nodes -o json > "$TMP/nodes.json" || return 1
      jq -e --arg node "$NODE" --arg expected "$EXPECTED_NODES" --argjson allow "$allow_cordon" '
        ($expected | split(",")) as $names |
        ([.items[].metadata.name] | sort) == ($names | sort) and
        all(.items[]; any(.status.conditions[]?; .type=="Ready" and .status=="True") and
          all(.status.conditions[]?; if (.type=="MemoryPressure" or .type=="DiskPressure" or .type=="PIDPressure") then .status=="False" else true end) and
          ((.metadata.name==$node and $allow) or .spec.unschedulable!=true))' "$TMP/nodes.json" >/dev/null || return 1
      HEALTH_REASON="heartbeat (Lease) de um no ausente ou com mais de 120s"
      k -n kube-node-lease get leases -o json > "$TMP/leases.json" || return 1
      jq -e --arg expected "$EXPECTED_NODES" --argjson now "$(date +%s)" '
        .items as $leases | all(($expected|split(","))[]; . as $n |
          any($leases[];
          (.spec.renewTime | sub("\\.[0-9]+Z$";"Z") | fromdateiso8601) as $t |
          (.metadata.name==$n and ($now-$t) < 120 and ($now-$t) > -120)))' "$TMP/leases.json" >/dev/null || return 1
      longhorn_health || return 1
      HEALTH_REASON="algumas aplicações ainda não recuperaram todas as réplicas"
      k get deployment,statefulset,daemonset -A -o json > "$TMP/workloads.json" || return 1
      jq -e 'all(.items[];
        (.status.observedGeneration // 0) >= .metadata.generation and
        if .kind=="DaemonSet" then (.status.numberReady // 0) >= (.status.desiredNumberScheduled // 0)
        else (.status.readyReplicas // 0) >= (.spec.replicas // 1) end)' "$TMP/workloads.json" >/dev/null || return 1
    }
    wait_health() {
      local allow_cordon=${1:-false} deadline=$((SECONDS+HEALTH_TIMEOUT)) since=-1 last_log=-30 last_reason=''
      log "[INFO] Verificando a API, os sinais de vida dos nós, as aplicações e os volumes. Exigindo ${STABLE_SECONDS}s de saúde contínua antes de continuar."
      while (( SECONDS < deadline )); do
        if health_once "$allow_cordon"; then
          if (( since < 0 )); then
            since=$SECONDS
            log '[OK] A API responde, os nós estão ativos e as aplicações têm as réplicas esperadas.'
            jq -r '.items[] | "[OK] \(.metadata.name): pronto e com agendamento liberado."' "$TMP/nodes.json" | while IFS= read -r line; do log "$line"; done
            if [[ $LH_ACTIVE == true ]]; then
              log "[OK] Longhorn: $(jq '.items|length' "$TMP/volumes.json") volume(s) saudável(is)."
            else
              log '[VOLUMES] Longhorn ausente ou sem volumes. Prosseguindo com as verificações de volumes locais e PDBs.'
            fi
            log "[AGUARDANDO] Verificações aprovadas. Observando o cluster por ${STABLE_SECONDS}s para confirmar a estabilidade."
          fi
          if (( SECONDS-since >= STABLE_SECONDS )); then log '[OK] Cluster saudável durante todo o intervalo de observação. Próxima etapa liberada.'; return 0; fi
        else
          since=-1
          if [[ $last_reason != "$HEALTH_REASON" ]] || (( SECONDS-last_log >= 30 )); then
            log "[AGUARDANDO] Ainda não é seguro continuar: $HEALTH_REASON. Aguardando a recuperação; o próximo nó permanece bloqueado."
            if [[ -s $TMP/nodes.json ]]; then
              jq -r --arg expected "$EXPECTED_NODES" '
                .items as $nodes | ($expected|split(","))[] as $name |
                ([$nodes[]|select(.metadata.name==$name)][0]) as $n |
                if $n==null then "[NO] \($name) AUSENTE"
                else "[NO] \($name) Ready=\([$n.status.conditions[]?|select(.type=="Ready")|.status][0] // "Unknown") cordon=\($n.spec.unschedulable // false) pressao=\([$n.status.conditions[]?|select((.type=="MemoryPressure" or .type=="DiskPressure" or .type=="PIDPressure") and .status!="False")|.type]|join(","))" end' "$TMP/nodes.json" || true
            fi
            [[ ! -s $TMP/volumes.json ]] || jq -r '.items[] | "[VOLUME] \(.metadata.name) estado=\(.status.state) saude=\(.status.robustness)"' "$TMP/volumes.json"
            [[ ! -s $TMP/workloads.json ]] || jq -r '.items[] | select((.status.readyReplicas // .status.numberReady // 0) < (.spec.replicas // .status.desiredNumberScheduled // 1)) | "[WORKLOAD] \(.kind) \(.metadata.namespace)/\(.metadata.name) prontas=\(.status.readyReplicas // .status.numberReady // 0) desejadas=\(.spec.replicas // .status.desiredNumberScheduled // 1)"' "$TMP/workloads.json"
            last_log=$SECONDS; last_reason=$HEALTH_REASON
          fi
        fi
        sleep 10
      done
      fail 'Timeout de saude; corrigir nos, PDB/capacidade/workloads ou reconstrucoes Longhorn antes de continuar.'
    }

    longhorn_health() {
      LH_ACTIVE=false
      # Discovery bem-sucedida sem o grupo = ausente. Erro de API/RBAC = bloqueio.
      HEALTH_REASON="consulta da API Longhorn falhou; ausencia de permissao nao sera tratada como ausencia de Longhorn"
      k get --raw /apis > "$TMP/apis.json" || return 1
      jq -e '.groups | type=="array"' "$TMP/apis.json" >/dev/null || return 1
      if ! jq -e 'any(.groups[]; .name=="longhorn.io")' "$TMP/apis.json" >/dev/null; then
        printf '{"items":[]}\n' > "$TMP/volumes.json"
        return 0
      fi
      HEALTH_REASON="consulta dos volumes Longhorn falhou"
      k get volumes.longhorn.io -A -o json > "$TMP/volumes.json" || return 1
      if jq -e '.items|length==0' "$TMP/volumes.json" >/dev/null; then return 0; fi
      LH_ACTIVE=true
      HEALTH_REASON="namespace Longhorn diverge do configurado ou consulta de nos/engines falhou"
      jq -e --arg ns "$LH_NAMESPACE" 'all(.items[]; .metadata.namespace==$ns)' "$TMP/volumes.json" >/dev/null || return 1
      k -n "$LH_NAMESPACE" get nodes.longhorn.io -o json > "$TMP/lh-nodes.json" || return 1
      k -n "$LH_NAMESPACE" get engines.longhorn.io -o json > "$TMP/engines.json" || return 1
      HEALTH_REASON="há volumes Longhorn degradados, sendo anexados ou em recuperação"
      jq -e 'all(.items[]; .metadata.deletionTimestamp==null and
        ((.status.state=="attached" and .status.robustness=="healthy") or
        (.status.state=="detached" and (.status.robustness=="healthy" or .status.robustness=="unknown"))))' "$TMP/volumes.json" >/dev/null || return 1
      HEALTH_REASON="nos do Longhorn ainda nao estao Ready"
      jq -e '(.items|length)>0 and all(.items[]; any(.status.conditions[]?; .type=="Ready" and .status=="True"))' "$TMP/lh-nodes.json" >/dev/null || return 1
      HEALTH_REASON="há réplicas Longhorn em reconstrução ou sem leitura e escrita"
      jq -e 'all(.items[]; all((.status.replicaModeMap // {})[]; .=="RW"))' "$TMP/engines.json" >/dev/null || return 1
      return 0
    }

    # Kubelet pode aceitar Pods antes de a unidade Type=notify do RKE2 ficar active.
    wait_rke2() {
      local deadline=$((SECONDS+600))
      until host /bin/bash -c 'if systemctl is-enabled rke2-server.service >/dev/null 2>&1; then systemctl is-active --quiet rke2-server; else systemctl is-active --quiet rke2-agent; fi'; do
        (( SECONDS < deadline )) || fail 'RKE2 nao ficou ativo em 600s; examinar journalctl -u rke2-server/-agent.'
        log "[RKE2] Kubernetes pode mostrar Ready antes de o servico terminar de iniciar. Aguardando RKE2 ativo; restam $((deadline-SECONDS))s. Proximo no bloqueado."
        sleep 10
      done
    }
  # Confere SO, ferramentas e espaco livre no host antes da transacao.
  host-preflight.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    export LC_ALL=C
    # RKE2 em raiz imutavel instala os binarios em /opt/rke2/bin.
    export PATH="$PATH:/opt/rke2/bin"
    profile=${1:?}
    . /etc/os-release
    if [[ $profile == micro62 ]]; then
      # Micro 6.2 pode anunciar SLES 16.0 nos campos de compatibilidade.
      [[ ${VARIANT_ID:-} == transactional && ${SUSE_SUPPORT_PRODUCT:-} == 'SUSE Linux Micro' && ${SUSE_SUPPORT_PRODUCT_VERSION:-} == 6.2 ]] ||
        [[ ( ${ID:-} == sl-micro || ${ID:-} == sle-micro ) && ${VERSION_ID:-} == 6.2 ]]
      for t in transactional-update btrfs; do command -v "$t" >/dev/null; done
    elif [[ $profile == zypper || $profile == sles ]]; then
      # Apenas sistemas tradicionais. Micro/Tumbleweed exigem outro fluxo.
      [[ ( ${ID:-} == sles || ${ID:-} == opensuse-leap ) && ${VARIANT_ID:-} != transactional ]]
      [[ $(findmnt -no OPTIONS /) == *rw* ]]
      for t in zypper rpm cmp sort; do command -v "$t" >/dev/null; done
    else
      echo "ERRO: perfil desconhecido: $profile" >&2
      exit 1
    fi
    echo "[HOST] Sistema identificado: ${PRETTY_NAME:-$ID}."
    for t in systemd-run systemctl flock findmnt tee; do command -v "$t" >/dev/null; done
    systemctl show --property=Version --value >/dev/null
    # Disco: nao iniciar atualizacao com menos de 2 GiB livres no root/var.
    for p in / /var; do
      available=$(df -Pk "$p" | awk 'NR==2 {print $4}')
      (( available >= 2097152 ))
    done

    if systemctl is-active --quiet rke2-server; then
      command -v rke2 >/dev/null || { echo "ERRO: rke2 ausente em PATH; conferir /opt/rke2/bin ou instalacao do servidor antes do drain." >&2; exit 1; }
    fi
  # Executa transactional-update (Micro) ou zypper (SLES) no systemd do host.
  host-worker.sh: |
    #!/bin/bash
    # Executado como unidade do systemd do host, fora do cgroup do Pod.
    set -Eeuo pipefail
    export LC_ALL=C
    # RKE2 em raiz imutavel instala os binarios em /opt/rke2/bin.
    export PATH="$PATH:/opt/rke2/bin"
    STATE=${1:?}
    PROFILE=${2:?}
    ACTIVATE_PENDING=${3:-false}
    [[ $STATE =~ ^/var/lib/suc-os/[a-zA-Z0-9_-]+$ ]]
    # Copia persistente permite ao Pod mostrar a transacao e retomar os logs apos reboot.
    exec > >(tee -a "$STATE/operation.log") 2>&1
    host_log() { printf "%s [HOST] %s\n" "$(date -u +%FT%TZ)" "$*"; }
    write_state() { printf '%s\n' "$2" > "$STATE/$1.tmp"; mv "$STATE/$1.tmp" "$STATE/$1"; }
    on_exit() {
      local rc=$?
      if (( rc != 0 )) && [[ $(cat "$STATE/phase" 2>/dev/null || true) != reboot-pending ]]; then
        write_state error "exit=$rc linha=${BASH_LINENO[0]}; consultar journalctl -u suc-os-${STATE##*/}.service"
        write_state phase failed
        echo 'ERRO: transacao interrompida. Corrigir causa antes de remover trava; nenhum reboot autorizado por este erro.' >&2
      fi
    }
    trap 'rc=$?; echo "ERRO host linha=$LINENO exit=$rc comando=$BASH_COMMAND" >&2' ERR
    trap on_exit EXIT
    trap 'exit 143' TERM
    exec 9>/var/lib/suc-os/host-update.lock
    flock -n 9
    write_state old-boot "$(cat /proc/sys/kernel/random/boot_id)"
    write_state phase running
    host_log "[PRE-CHECAGEM] Conferindo agendamentos automaticos e ausencia de outro reboot/transacao."
    for unit in transactional-update.timer transactional-update.service os-update.timer os-update.service rebootmgr.service; do
      state=$(systemctl show "$unit" -p ActiveState --value)
      [[ $state == inactive || $state == failed ]]
    done
    [[ ! -f /run/systemd/shutdown/scheduled ]]
    # Snapshot etcd antes da manutencao do SO em cada servidor.
    if systemctl is-active --quiet rke2-server; then
      command -v rke2 >/dev/null
      host_log "[BACKUP] Salvando snapshot etcd pre-os-${STATE##*/} antes de alterar o SO."
      rke2 etcd-snapshot save --name "pre-os-${STATE##*/}"
      host_log "[BACKUP] Snapshot etcd concluido."
    fi
    reboot_required=false
    if [[ $PROFILE == micro62 ]]; then
      before=$(btrfs inspect-internal rootid /)
      target=$(btrfs subvolume get-default /); target=${target#ID }; target=${target%% *}
      [[ $before =~ ^[0-9]+$ && $target =~ ^[0-9]+$ ]]
      write_state old-root "$before"
      if [[ $target != "$before" ]]; then
        [[ $ACTIVATE_PENDING == true ]]
        echo "Snapshot pendente $target detectado; ativando depois do drain. Nova transacao fica para a proxima rodada."
        write_state result pending-snapshot-activated
        reboot_required=true
      else
        host_log "[SO] Executando transactional-update --non-interactive --drop-if-no-change up; verificando repositorios e pacotes."
        transactional-update --non-interactive --drop-if-no-change up
        target=$(btrfs subvolume get-default /); target=${target#ID }; target=${target%% *}
        [[ $target =~ ^[0-9]+$ ]]
        if [[ $target == "$before" ]]; then
          echo 'SEM ATUALIZACOES: nenhum snapshot novo; o SO NAO sera reiniciado. O fluxo seguira para o proximo no apos verificar a saude.'
          write_state result no-change-no-reboot
        else
          host_log "[SO] Nova raiz Btrfs preparada: $before -> $target. Sera necessario reboot para ativa-la."
          write_state result updated-and-rebooted
          reboot_required=true
        fi
      fi
      write_state target-root "$target"
    else
      # openSUSE Leap/SLES tradicional: zypper altera a raiz ativa. Nunca usar em Micro.
      . /etc/os-release
      [[ ( $PROFILE == zypper || $PROFILE == sles ) && ( ${ID:-} == sles || ${ID:-} == opensuse-leap ) && ${VARIANT_ID:-} != transactional ]]
      [[ $(findmnt -no OPTIONS /) == *rw* ]]
      rpm -qa --qf '%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE} %{ARCH}\n' | sort > "$STATE/rpm-before"
      host_log "[SO] Atualizando metadados dos repositorios com zypper refresh."
      zypper --non-interactive refresh
      # patch aplica correcoes; --with-update inclui pacotes sem patch correspondente.
      # --with-interactive inclui patches que exigem reboot; licencas nao sao aceitas a forca.
      # 102/103 sao codigos informativos documentados; 103 pede repetir o patch.
      patch_rc=103
      for attempt in 1 2 3; do
        patch_rc=0
        host_log "[SO] Executando zypper patch --with-update --with-interactive, tentativa $attempt/3."
        zypper --non-interactive patch --with-update --with-interactive || patch_rc=$?
        case "$patch_rc" in 0|102) break ;; 103) echo 'Gerenciador atualizado; repetindo patch.' ;; *) exit "$patch_rc" ;; esac
      done
      [[ $patch_rc != 103 ]]
      rpm -qa --qf '%{NAME} %{EPOCHNUM}:%{VERSION}-%{RELEASE} %{ARCH}\n' | sort > "$STATE/rpm-after"
      reboot_rc=0
      zypper --non-interactive needs-rebooting || reboot_rc=$?
      case "$reboot_rc" in 0|102) ;; *) exit "$reboot_rc" ;; esac
      if cmp -s "$STATE/rpm-before" "$STATE/rpm-after"; then
        [[ $reboot_rc == 0 && $patch_rc != 102 ]] || { echo 'Ha reboot anterior pendente; requer avaliacao.' >&2; exit 1; }
        write_state result no-change-no-reboot
        echo 'SEM ATUALIZACOES: inventario RPM inalterado; SO NAO sera reiniciado.'
      else
        # Reinicio conservador apos alteracoes, para carregar todos os binarios novos.
        write_state result updated-and-rebooted
        reboot_required=true
      fi
    fi
    if [[ $reboot_required == false ]]; then write_state phase done; exit 0; fi
    write_state phase reboot-pending
    sync
    host_log "[REBOOT] Solicitando reinicio completo. O Pod atual pode terminar como Unknown/Failed; outro Pod do MESMO Job retomara a verificacao do boot, snapshot e saude. Isso ainda nao significa conclusao do no."
    systemctl reboot || { write_state phase failed; exit 1; }
    # Durante shutdown o systemd encerra esta unidade. Nao transformar isso em falha.
    trap - TERM
    sleep 300
    write_state error 'Reboot nao concluiu em 300 segundos; diagnosticar systemd.'
    write_state phase failed
    exit 1
  # Bloqueia volumes locais e backends nao revisados antes de remover qualquer Pod.
  storage-guard.jq: |
    # Verifica cada volume dos pods ativos do no APOS cordon. Falha com recurso e causa.
    def infra: (.metadata.annotations["kubernetes.io/config.mirror"] != null) or
      any(.metadata.ownerReferences[]?; .kind == "DaemonSet");
    def approved_host($p; $v): any($policy[0].hostPathAllowlist[]?;
      .namespace == $p.metadata.namespace and .serviceAccount == $p.spec.serviceAccountName and
      (.ownerKind as $kind | any($p.metadata.ownerReferences[]?; .kind == $kind)) and
      (.paths | index($v.hostPath.path)) != null);
    def remote($pv): ($pv.spec.local == null and $pv.spec.hostPath == null) and
      ($pv.spec.csi.driver == "driver.longhorn.io" or $pv.spec.nfs != null or
       (($pv.spec.csi.driver // "") as $d | $d != "" and ($policy[0].remoteCSIDrivers | index($d)) != null));
    .items[] | select(.status.phase != "Succeeded" and .status.phase != "Failed") |
    select(.metadata.labels["upgrade.cattle.io/controller"] == null) | . as $pod |
    .spec.volumes[]? | . as $v |
    "\($pod.metadata.namespace)/\($pod.metadata.name) volume=\(.name)" as $where |
    if .persistentVolumeClaim then
      ([$pvcs[0].items[] | select(.metadata.namespace == $pod.metadata.namespace and .metadata.name == $v.persistentVolumeClaim.claimName)][0]) as $pvc |
      ([$pvs[0].items[] | select(.metadata.name == $pvc.spec.volumeName)][0]) as $pv |
      if $pvc == null or $pv == null then "\($where): PVC/PV nao resolvido; corrigir o binding antes de repetir"
      elif remote($pv) then empty
      else "\($where): PV \($pv.metadata.name) local/hostPath/backend nao revisado; migrar ou definir procedimento da aplicacao" end
    elif .hostPath and (($pod | infra) | not) and (approved_host($pod; $v) | not) then
      "\($where): hostPath \(.hostPath.path) nao revisado; comprovar finalidade antes de incluir excecao"
    elif .emptyDir != null and (($pod | infra) | not) and ($policy[0].allowEmptyDirDeletion != true) then
      "\($where): emptyDir perderia dados; migrar para PVC ou autorizar explicitamente o descarte"
    elif .ephemeral or .csi then "\($where): CSI inline/efemero exige revisao"
    else empty end
  # Politica do lab: emptyDir pode ser descartado por autorizacao; reveja para outro ambiente.
  policy.json: |
