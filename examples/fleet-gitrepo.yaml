# Aplicar no cluster Rancher (management), nao no downstream.
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: suc-os-mpba
  namespace: fleet-default
spec:
  repo: https://github.com/kaioneuhauss/SUC-DS
  branch: main
  paths:
    - plano
  targets:
    - name: mpba
      clusterSelector:
        matchLabels:
          management.cattle.io/cluster-display-name: mpba-teste
