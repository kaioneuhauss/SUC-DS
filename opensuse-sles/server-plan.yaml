# openSUSE Leap / SLES com raiz gravavel. Fleet aplica somente ao cluster selecionado.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: os-maintenance-zypper
  namespace: cattle-system
  annotations:
    # Tambem recalcular a execucao se imagem, parametros ou prepare mudarem.
    # A version e o conteudo do Secret ja entram no hash padrao do SUC.
    upgrade.cattle.io/digest: spec.upgrade.envs,spec.upgrade.image,spec.prepare
spec:
  # Um no por vez neste Plan. A trava impede sobreposicao de manutencoes.
  concurrency: 1
  exclusive: true                 # Evita outro Plan exclusivo no mesmo no.
  jobActiveDeadlineSecs: 18000  # Limite total do Job, em segundos.
  postCompleteDelay: 30s          # Pausa adicional antes do proximo no.
  serviceAccountName: system-upgrade-controller  # Conta existente do SUC.

  # UNICA ALTERACAO HABITUAL: novo identificador para este unico Plan.
  # Exemplo futuro: sles-20261019-01. Isso dispara updates disponiveis no repositorio;
  # nao seleciona uma release do SO. Espere a rodada anterior terminar.
  version: opensuse-20261018-02

  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
    # Label de funcao; os nomes dos servers sao descobertos automaticamente.
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  tolerations:
    - operator: Exists            # Permite masters com taints e retomada apos cordon.
  secrets:
    - name: os-maintenance-shared-scripts
      path: /run/suc-os            # Scripts legiveis definidos no Secret compartilhado.

  prepare:
    # Atualize esta tag quando atualizar o RKE2 do cluster. Ex.: v1.35.6+rke2r1
    # vira v1.35.6-rke2r1. Esta imagem fornece bash/kubectl/jq para os scripts de SO.
    # &maintenance_image nomeia a imagem; *maintenance_image abaixo reutiliza-a.
    image: &maintenance_image registry.rancher.com/rancher/rke2-upgrade:v1.35.6-rke2r1
    command: [/bin/bash]
    args: [/run/suc-os/prepare.sh]  # Mostra verificacoes e motivos de espera no log.

  upgrade:
    image: *maintenance_image
    command: [/bin/bash]
    args: [/run/suc-os/run.sh]      # Trava -> saude -> drain -> SO -> validar/liberar.
    securityContext:
      privileged: true            # Necessario para operar o SO via /host.
      runAsUser: 0
    envs:
      # update = rotina; prepare-host = preparacao inicial dos agendamentos.
      - name: ACTION
        value: update
      - name: PROFILE
        value: zypper               # Confere o SO antes de executar qualquer transacao.
    # Tempos, namespace Longhorn e demais padroes ficam comentados em common.sh,
    # dentro do Secret. Nao e preciso editar scripts para disparar a proxima rodada.
