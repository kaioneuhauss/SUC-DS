# Scripts em texto normal, sem credenciais. Não é necessário editar base64.
# O disparo é controlado por version nos Plans (ignoreUpdates: true).
apiVersion: v1
kind: Secret
metadata:
  name: os-maintenance-shared-scripts
  namespace: cattle-system
type: Opaque
stringData:
  common.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    export LC_ALL=C
    NODE=${SYSTEM_UPGRADE_NODE_NAME:?}
    VERSION=${SYSTEM_UPGRADE_PLAN_LATEST_VERSION:?}
    NS=${PLAN_NAMESPACE:-cattle-system}
    HEALTH_TIMEOUT=${HEALTH_TIMEOUT:-900} # Espera de recuperação: 15 minutos.
    STABLE_SECONDS=${STABLE_SECONDS:-30} # Saúde contínua antes de concluir o nó.
    POLL_SECONDS=${POLL_SECONDS:-10}
    # A imagem de ferramentas pode trazer KUBECONFIG do RKE2. Usar a credencial
    # projetada do próprio Pod, sem depender do kubeconfig ou de tokens do host.
    export KUBECONFIG=$(mktemp)
    chmod 600 "$KUBECONFIG"
    # Usar o IP injetado pelo Kubernetes evita depender do DNS durante reboot.
    api_host=${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}
    [[ $api_host != *:* ]] || api_host="[$api_host]"
    api_port=${KUBERNETES_SERVICE_PORT:-443}
    cat > "$KUBECONFIG" <<KUBE
    apiVersion: v1
    kind: Config
    clusters:
    - name: cluster
      cluster:
        server: https://$api_host:$api_port
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
    - name: job
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
    - name: job
      context: {cluster: cluster, user: job}
    current-context: job
    KUBE
    k() { kubectl --request-timeout=30s "$@"; }
    log() {
      local color='1;34'
      case "$1" in OK) color='1;32';; ERRO) color='1;31';; AGUARDANDO) color='1;33';; esac
      if [[ ${LOG_COLOR:-true} == true ]]; then printf '\033[%sm[%s] %s\033[0m\n' "$color" "$1" "$2"
      else printf '[%s] %s\n' "$1" "$2"; fi
    }
    fail() { log ERRO "$*"; exit 1; }
    trap 'rc=$?; log ERRO "Falha na linha $LINENO (código $rc). Atualização deste nó interrompida. Confira a saída acima e corrija a causa antes de repetir."; exit "$rc"' ERR

    # Ready e pressão de recursos. Cordon do próprio nó é esperado após o drain
    # ou numa nova tentativa; nunca usar esse cordon como motivo para bloquear a si mesmo.
    nodes_ready() {
      local nodes bad
      nodes=$(k get nodes -l kubernetes.io/os=linux -o json 2>&1) || {
        log AGUARDANDO "API indisponível ao consultar nós; tentando novamente em ${POLL_SECONDS}s. Detalhe: $(tail -n 1 <<<"$nodes")"
        return 1
      }
      bad=$(jq -r --arg self "$NODE" '
        .items[] | select(
          (any(.status.conditions[]?; .type=="Ready" and .status=="True")|not) or
          any(.status.conditions[]?; (.type=="MemoryPressure" or .type=="DiskPressure" or .type=="PIDPressure") and .status!="False") or
          (.metadata.name!=$self and .spec.unschedulable==true)
        ) | .metadata.name' <<<"$nodes") || fail 'Resposta inválida ao consultar nós.'
      [[ $(jq '.items|length' <<<"$nodes") -gt 0 ]] || fail 'Nenhum nó Linux encontrado; conferir acesso à API.'
      if [[ -n $bad ]]; then log AGUARDANDO "Nós ainda indisponíveis, sob pressão ou cordonados: ${bad//$'\n'/, }."; return 1; fi
    }

    # Opcional: ausência de Longhorn é normal. Erro de API não significa ausência.
    # Sem inventário de hostPath, sem liberação por nome de Pod e sem alterar volumes.
    longhorn_ready() {
      local crd volumes bad
      crd=$(k get crd volumes.longhorn.io --ignore-not-found -o name 2>&1) || {
        log AGUARDANDO "API indisponível ao consultar Longhorn; tentando novamente em ${POLL_SECONDS}s. Detalhe: $(tail -n 1 <<<"$crd")"
        return 1
      }
      [[ -n $crd ]] || return 0
      volumes=$(k get volumes.longhorn.io -A -o json 2>&1) || {
        log AGUARDANDO "API indisponível ao consultar volumes Longhorn; tentando novamente em ${POLL_SECONDS}s. Detalhe: $(tail -n 1 <<<"$volumes")"
        return 1
      }
      bad=$(jq -r '.items[] | select(
        (.status.state=="attached" and .status.robustness=="healthy") or
        (.status.state=="detached" and (.status.robustness=="healthy" or .status.robustness=="unknown"))
        | not) | "\(.metadata.name): \(.status.state)/\(.status.robustness)"' <<<"$volumes") || fail 'Resposta inválida ao consultar Longhorn.'
      if [[ -n $bad ]]; then log AGUARDANDO "Longhorn em recuperação: ${bad//$'\n'/; }."; return 1; fi
    }

    # No prepare: somente nós. Após o update/uncordon: nós e Longhorn, quando presente.
    wait_health() {
      local check_volumes=${1:-false} deadline=$((SECONDS+HEALTH_TIMEOUT)) healthy_since=-1
      while (( SECONDS < deadline )); do
        if nodes_ready && { [[ $check_volumes == false ]] || longhorn_ready; }; then
          if (( healthy_since < 0 )); then healthy_since=$SECONDS; log INFO "Nós respondendo. Confirmando estabilidade por ${STABLE_SECONDS}s."; fi
          if (( SECONDS-healthy_since >= STABLE_SECONDS )); then log OK 'Verificações concluídas.'; return 0; fi
        else healthy_since=-1; fi
        sleep "$POLL_SECONDS"
      done
      fail "Recuperação não concluída em ${HEALTH_TIMEOUT}s. Confira kubectl get nodes e, se instalado, os volumes no Longhorn. O próximo nó deste fluxo não será atualizado."
    }
  prepare.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    DIR=$(cd -- "$(dirname -- "$0")" && pwd)
    source "$DIR/common.sh"
    log INFO "Preparando nó $NODE. Rodada: $VERSION."

    # Dois Plans, uma ordem: workers só passam ao drain quando todos os servers
    # concluírem a MESMA version. Não cria nem modifica objetos Kubernetes.
    if [[ -n ${SERVER_PLAN:-} ]]; then
      deadline=$((SECONDS+${SERVER_WAIT_TIMEOUT:-43200}))
      while :; do
        if ! server=$(k -n "$NS" get plan "$SERVER_PLAN" -o json 2>&1); then
          log AGUARDANDO "API indisponível ao consultar o Plan de servidores. Detalhe: $(tail -n 1 <<<"$server")"
          (( SECONDS < deadline )) || fail 'Tempo de espera da API esgotado. Verifique o servidor Kubernetes antes de repetir.'
          sleep 30
          continue
        fi
        if jq -e --arg v "$VERSION" '
          .spec.version==$v and .status.latestVersion==$v and
          any(.status.conditions[]?; .type=="Complete" and .status=="True")
        ' <<<"$server" >/dev/null; then break; fi
        reason=$(jq -r '[.status.conditions[]? | select(.type=="Complete") | (.message // .reason)] | join("; ")' <<<"$server")
        log AGUARDANDO "Servidores ainda não concluíram $VERSION. $reason. Nenhum drain ou update iniciado neste worker."
        (( SECONDS < deadline )) || fail 'Tempo de espera dos servidores esgotado. Confira os logs do Plan de servidores e use a mesma version nos dois Plans.'
        sleep 30
      done
    fi
    log INFO 'Verificando se os nós estão disponíveis antes do drain.'
    wait_health false
    log OK 'Preparação concluída. Próxima etapa: container drain, executado pelo próprio SUC.'
    log INFO 'Se o drain falhar, o update não inicia. No log drain, confira os Pods/PDBs indicados; corrija capacidade, aplicação ou storage antes de repetir. Não remova PDBs ou finalizers para forçar.'
  upgrade.sh: |
    #!/bin/bash
    set -Eeuo pipefail
    DIR=$(cd -- "$(dirname -- "$0")" && pwd)
    source "$DIR/common.sh"
    HASH=${SYSTEM_UPGRADE_PLAN_LATEST_HASH:?}
    [[ $HASH =~ ^[a-zA-Z0-9_-]+$ ]] || fail 'Identificador de execução inválido.'
    STATE=/var/lib/suc-os-simple/$HASH
    log OK "Drain concluído pelo SUC em $NODE. Iniciando a etapa de atualização."

    # Executa no SO do nó. O pequeno registro local evita repetir a instalação após
    # o reboot ou uma repetição do Pod; não é uma trava e não existe ConfigMap.
    chroot /host /bin/bash -s -- "$STATE" < "$DIR/host-update.sh"
    log INFO 'Atualização concluída. Liberando o agendamento e aguardando a recuperação.'
    k uncordon "$NODE"
    wait_health true
    log OK "Manutenção concluída em $NODE. Resultado: $(cat "/host$STATE/result"). O próximo nó pode continuar."
  host-update.sh: |
    #!/bin/bash
    # Executado dentro do host, somente depois do drain nativo terminar.
    set -Eeuo pipefail
    export LC_ALL=C
    STATE=${1:?}
    [[ $STATE =~ ^/var/lib/suc-os-simple/[a-zA-Z0-9_-]+$ ]]
    mkdir -p "$STATE"
    trap 'rc=$?; printf "[ERRO] Atualização do SO interrompida na linha %s (código %s). Conferir a saída do gerenciador de pacotes; não iniciar outro nó.\n" "$LINENO" "$rc"; exit "$rc"' ERR
    boot=$(cat /proc/sys/kernel/random/boot_id)
    reboot_node() {
      printf '[REBOOT] Reinício solicitado pelo SO. A conclusão será confirmada por um novo Pod após o boot.\n'
      sync
      systemctl reboot
      sleep 300
      printf '[ERRO] O reinício não terminou em 300s. Conferir systemctl status e journalctl no nó.\n'
      exit 1
    }
    # Resultado já registrado: não executar o gerenciador de pacotes novamente.
    if [[ -f $STATE/result ]]; then
      if [[ -f $STATE/reboot-from ]]; then
        if [[ $(cat "$STATE/reboot-from") == "$boot" ]]; then reboot_node; fi
        if [[ -f $STATE/target-root ]]; then
          [[ $(btrfs inspect-internal rootid /) == "$(cat "$STATE/target-root")" ]] || {
            echo '[ERRO] O snapshot esperado não está ativo. Verificar rollback antes de continuar.'; exit 1;
          }
        fi
        echo '[OK] Reinício confirmado; retomando sem repetir a instalação.'
      else echo '[OK] Atualização já executada nesta rodada; retomando a verificação.'; fi
      exit 0
    fi
    . /etc/os-release
    reboot_required=false

    [[ ${ID:-} == ubuntu && ( ${VERSION_ID:-} == 22.04 || ${VERSION_ID:-} == 24.04 ) ]] || {
      echo '[ERRO] Este perfil exige Ubuntu 22.04 ou 24.04.'; exit 1;
    }
    echo "[INFO] Executando atualização em $PRETTY_NAME com apt-get."
    # O needrestart não deve reiniciar RKE2/DNS durante a instalação.
    # Serviços pendentes serão ativados em um reboot solicitado pelo Ubuntu ou
    # deverão ser tratados em manutenção separada quando não houver reboot.
    export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l UCF_FORCE_CONFFOLD=1
    dpkg-query -W -f='${binary:Package} ${Version}\n' | sort > "$STATE/before"
    # Falha de repositório é erro; preserva configuração local e não remove pacotes.
    apt-get -o APT::Update::Error-Mode=any update
    apt-get -o DPkg::Lock::Timeout=60 -o Dpkg::Options::=--force-confold \
      --assume-yes --with-new-pkgs --no-remove upgrade
    dpkg-query -W -f='${binary:Package} ${Version}\n' | sort > "$STATE/after"
    if [[ -f /run/reboot-required ]]; then
      result='atualização com reinício solicitado pelo Ubuntu'; reboot_required=true
    elif cmp -s "$STATE/before" "$STATE/after"; then
      result='sem alterações; sem reinício'
      echo '[OK] Nenhum pacote alterado e nenhum pedido de reboot. O nó não será reiniciado.'
    else
      result='pacotes atualizados; sem reinício'
      echo '[OK] Pacotes atualizados. O Ubuntu não solicitou reboot.'
    fi

    # Gravar antes de reiniciar: o novo Pod reconhecerá esta mesma execução.
    if [[ $reboot_required == true ]]; then printf '%s\n' "$boot" > "$STATE/reboot-from"; fi
    printf '%s\n' "$result" > "$STATE/result.tmp"
    mv "$STATE/result.tmp" "$STATE/result"
    if [[ $reboot_required == true ]]; then reboot_node; fi
