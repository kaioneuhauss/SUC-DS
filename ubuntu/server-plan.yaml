# Perfil ubuntu. Um Plan para servidores e, quando aplicável, outro para workers.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: os-maintenance-server
  namespace: cattle-system
spec:
  concurrency: 1                 # Um nó por vez neste Plan.
  exclusive: true                # Não sobrepor outro Plan exclusivo no mesmo nó.
  jobActiveDeadlineSecs: 0        # Não matar uma instalação de pacotes por tempo total.
  postCompleteDelay: 30s          # Pausa entre nós depois da conclusão.
  serviceAccountName: system-upgrade-controller

  # ALTERAÇÃO HABITUAL: mudar este identificador nos DOIS Plans juntos.
  # Dispara os updates disponíveis; não seleciona uma nova release do SO.
  # Espere a rodada atual terminar antes de mudar novamente.
  version: os-20261020-simple-01

  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
  tolerations:
    - operator: Exists           # Inclui taints de control-plane e cordon.
  cordon: true
  drain:                         # O SUC cria um init container chamado drain.
    timeout: 15m                 # Se não concluir, o container upgrade não inicia.
    ignoreDaemonSets: true       # DaemonSets são gerenciados pelo próprio cluster.
    force: false                 # Não remover Pods sem controlador à força.
    deleteEmptydirData: true    # true SOMENTE se aceitar perder os dados de emptyDir.
    disableEviction: false       # Respeitar PDBs e proteção do Longhorn.
  secrets:
    - name: os-maintenance-shared-scripts
      path: /run/suc-os
      ignoreUpdates: true        # Editar o Secret sozinho não dispara outra rodada.

  prepare:
    # Caixa de ferramentas (bash/kubectl/jq). Não atualiza o Kubernetes.
    # Ajuste a tag conforme o RKE2; mantenha kubectl compatível com a API.
    image: &tools registry.rancher.com/rancher/rke2-upgrade:v1.35.6-rke2r1
    command: [/bin/bash]
    args: [/run/suc-os/prepare.sh]

  upgrade:
    image: *tools
    command: [/bin/bash]
    args: [/run/suc-os/upgrade.sh]
    securityContext:
      privileged: true           # Necessário para chroot /host e reboot do nó.
      runAsUser: 0
